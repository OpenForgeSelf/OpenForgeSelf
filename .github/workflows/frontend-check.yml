name: Frontend Check (lint + typecheck)

on:
  push:
    branches: [master, main]
    paths:
      - 'ForgeSelf.Web/**'
      - 'scripts/check-theme-tokens.mjs'
      - 'scripts/custom-tokens-allow.json'
      - 'scripts/theme-tokens-antipattern-demo/**'
      - 'scripts/verify-theme-demo.mjs'
      - '.github/workflows/frontend-check.yml'
  pull_request:
    paths:
      - 'ForgeSelf.Web/**'
      - 'scripts/check-theme-tokens.mjs'
      - 'scripts/custom-tokens-allow.json'
      - 'scripts/theme-tokens-antipattern-demo/**'
      - 'scripts/verify-theme-demo.mjs'
      - '.github/workflows/frontend-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ForgeSelf.Web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # pnpm 必须先于 setup-node 安装：setup-node 的 cache: "pnpm" 会先执行 `pnpm store path`，
      # pnpm 不在 PATH 时该步直接报「Unable to locate executable file: pnpm」（PR#2 CI 实测失败点）。
      # 旧 `corepack enable` 在新 runner 上不可靠；与 release.yml 同参改用 pnpm/action-setup@v4，
      # 10.13.1 对齐 ForgeSelf.Web/package.json 的 packageManager 字段（pnpm-lock.yaml lockfileVersion 9.0 同源）。
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: ForgeSelf.Web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CT StoryHost（ForgeSelf.Web/src/components/*StoryHost.vue）静态 import 插件 SFC；
      # vue-tsc -b 会跟随进 Plugins/<X>/web/src。仅装宿主依赖时插件无 vue → TS2307 级联上千错
      # （2026-11-19 CI run 44525817715 / main 同构红）。此处只装「画廊已链接」的插件前端。
      - name: Install story-linked plugin frontends
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for d in Plugins/DbAdmin/web Plugins/SmartTerminal/web; do
            echo "::group::pnpm install $d"
            (cd "$d" && pnpm install --frozen-lockfile)
            echo "::endgroup::"
          done

      - name: Run lint + typecheck (pnpm run check)
        # check = vue-tsc -b && eslint . --ext .vue,.ts,.tsx && theme-check（主题 token 硬门禁，2026-11-23 W7 接线）
        # 任何 error 都会使构建失败，阻止合并
        run: pnpm run check

      - name: Theme token antipattern demo regression (check:theme:demo)
        # 反模式 fixture 32 处全捕获 + 合法对照零误伤（AC2）
        # 脚本登记在根 package.json——必须显式回仓库根（defaults.working-directory
        # 是 ForgeSelf.Web，2026-11-24 独立审查实证：继承默认目录会报缺脚本 ERR_PNPM_NO_SCRIPT）
        working-directory: ${{ github.workspace }}
        run: pnpm run check:theme:demo
