name: Release
# Tag-triggered auto publish: `git tag -a v0.1.0 -m "..." && git push github v0.1.0`
# All build/package/publish logic lives in scripts/release/*.ps1 (locally debuggable);
# this workflow only prepares toolchains and invokes the scripts.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags: needed by make-release-notes.ps1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          # >=22 required: DesignSystem plugin build runs a .ts script directly
          # (node scripts/gen-tokens-css.ts) -> needs native type stripping.
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build + package (scripts/release/release-local.ps1)
        shell: pwsh
        # 输入42：-Sign 走 scripts/sign-publish.ps1 Authenticode 签名（自签证书自动生成/复用，
        # 时间戳 digicert；商业证书场景在 CI secrets 传 -PfxPath/-PfxPassword 即可，脚本可插拔）
        run: ./scripts/release/release-local.ps1 -Version "${env:GITHUB_REF_NAME}" -Sign

      - name: Create GitHub Release (scripts/release/publish-release.ps1)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release/publish-release.ps1 -Version "${env:GITHUB_REF_NAME}" -Repo "${{ github.repository }}"
