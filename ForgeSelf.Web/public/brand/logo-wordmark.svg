<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-label="铸己匣 OpenForgeSelf">
  <defs>
    <filter id="wm-noise" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="9"/>
      <feColorMatrix values="0 0 0 0 0.75  0 0 0 0 0.16  0 0 0 0 0.10  0 0 0 0.5 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- 印章 -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="104" height="104" rx="3" fill="#C0392B"/>
    <rect x="0" y="0" width="104" height="104" rx="3" fill="#FBF7EE" opacity="0.08" filter="url(#wm-noise)"/>
    <rect x="10" y="10" width="84" height="84" fill="none" stroke="#FBF7EE" stroke-width="2" opacity="0.92"/>
    <g stroke="#FBF7EE" stroke-width="5.5" stroke-linecap="square" fill="none" opacity="0.96">
      <line x1="22" y1="22" x2="82" y2="22"/>
      <line x1="24" y1="22" x2="24" y2="82"/>
      <line x1="22" y1="82" x2="82" y2="82"/>
      <line x1="36" y1="36" x2="70" y2="36"/>
      <line x1="38" y1="36" x2="38" y2="66"/>
      <line x1="68" y1="36" x2="68" y2="66"/>
      <line x1="36" y1="51" x2="70" y2="51"/>
      <line x1="36" y1="66" x2="70" y2="66"/>
      <line x1="53" y1="36" x2="53" y2="76"/>
    </g>
  </g>
  <!-- 文字 -->
  <text x="132" y="58" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="42" font-weight="900" fill="#F4F0E7" letter-spacing="6">铸己匣</text>
  <text x="132" y="92" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#F59E0B" letter-spacing="4">OPEN · FORGE · SELF</text>
  <line x1="132" y1="70" x2="288" y2="70" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>
</svg>
