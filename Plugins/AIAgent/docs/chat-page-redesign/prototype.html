<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能体 · 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
<style>
  /* Token 来源：ForgeSelf.Web/src/styles/themes/workshop-forge.css 与 DESIGN.md。不新增 --surface/--forge/--app 类 token。 */
  :root {
    --gold-300: #F9BC4E;
    --gold-400: #F59E0B;
    --gold-500: #D97706;
    --gold-700: #B45309;
    --cinnabar-400: #C0392B;
    --bronze-500: #5A7A5A;
    --ink-950: #0B0908;
    --ink-900: #14110F;
    --ink-850: #1B1815;
    --ink-700: #322D28;
    --paper-white: #FBF7EE;
    --paper-warm: #F4EEDF;
    --fg-primary: #F4F0E7;
    --fg-secondary: #B5AB9F;
    --fg-tertiary: #8F8478;
    --fg-muted: #6B6058;
    --border-hairline: rgba(245, 240, 231, 0.06);
    --border-subtle: rgba(245, 240, 231, 0.1);
    --border-default: rgba(245, 240, 231, 0.16);
    --border-strong: rgba(245, 240, 231, 0.28);
    --border-brand: rgba(245, 158, 11, 0.48);
    --font-display: "Noto Serif SC", "Songti SC", ui-serif, serif;
    --font-serif-cn: "Noto Serif SC", "Songti SC", "SimSun", ui-serif, serif;
    --font-sans-cn: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --dur-fast: 160ms;
    --dur-base: 220ms;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
    --shadow-brand: 0 0 0 1px rgba(245, 158, 11, 0.4), 0 8px 24px rgba(245, 158, 11, 0.18);
    --radius-xs: 2px;
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 10px;
    --radius-xl: 14px;
    --radius-2xl: 20px;
    --glass-bg: rgba(20, 17, 15, 0.32);
    --glass-strong-bg: rgba(20, 17, 15, 0.55);
    --glass-blur: 18px;
    --glass-blur-strong: 24px;
    --glass-saturate: 140%;
    --glass-saturate-strong: 160%;
    --glass-border: 1px solid rgba(245, 240, 231, 0.08);
    --glass-radius: 12px;
    --glass-shadow: 0 6px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    --paper-tint-weak: rgba(245, 240, 231, 0.04);
    --paper-tint: rgba(245, 240, 231, 0.08);
    --gold-tint: rgba(245, 158, 11, 0.05);
    --gold-tint-strong: rgba(245, 158, 11, 0.12);
    --el-bg-color: #14110F;
    --el-bg-color-page: #0B0908;
    --el-bg-color-overlay: #1B1815;
    --el-fill-color: #24201C;
    --el-fill-color-light: #1B1815;
    --el-text-color-primary: #F4F0E7;
    --el-border-color: #322D28;
    --topbar-bg: rgba(11, 9, 8, 0.35);
    --status-bg: rgba(11, 9, 8, 0.4);
    --user-bubble: color-mix(in srgb, var(--gold-400) 9%, var(--ink-850));
  }
  html:not(.dark) {
    --fg-primary: #14110F;
    --fg-secondary: #4A443C;
    --fg-tertiary: #6B6058;
    --fg-muted: #A79C8F;
    --border-hairline: rgba(20, 17, 15, 0.06);
    --border-subtle: rgba(20, 17, 15, 0.1);
    --border-default: rgba(20, 17, 15, 0.16);
    --border-strong: rgba(20, 17, 15, 0.28);
    --border-brand: rgba(180, 83, 9, 0.48);
    --glass-bg: rgba(251, 247, 238, 0.4);
    --glass-strong-bg: rgba(251, 247, 238, 0.72);
    --glass-border: 1px solid rgba(20, 17, 15, 0.08);
    --glass-shadow: 0 6px 24px rgba(20, 17, 15, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    --paper-tint-weak: rgba(20, 17, 15, 0.04);
    --paper-tint: rgba(20, 17, 15, 0.08);
    --gold-tint: rgba(180, 83, 9, 0.05);
    --gold-tint-strong: rgba(180, 83, 9, 0.12);
    --shadow-sm: 0 1px 2px rgba(20, 17, 15, 0.18), 0 0 0 1px rgba(20, 17, 15, 0.08);
    --shadow-md: 0 4px 12px rgba(20, 17, 15, 0.2), 0 1px 2px rgba(20, 17, 15, 0.14);
    --shadow-lg: 0 12px 32px rgba(20, 17, 15, 0.24), 0 2px 6px rgba(20, 17, 15, 0.16);
    --shadow-brand: 0 0 0 1px rgba(180, 83, 9, 0.35), 0 8px 24px rgba(180, 83, 9, 0.14);
    --el-bg-color: #FBF7EE;
    --el-bg-color-page: #F4EEDF;
    --el-bg-color-overlay: #FFFFFF;
    --el-fill-color: #EFE8D8;
    --el-fill-color-light: #FBF7EE;
    --el-text-color-primary: #14110F;
    --el-border-color: #E4DCCB;
    --topbar-bg: rgba(251, 247, 238, 0.55);
    --status-bg: rgba(251, 247, 238, 0.5);
    --user-bubble: color-mix(in srgb, var(--gold-700) 8%, var(--paper-white));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-sans-cn);
    background: var(--el-bg-color-page);
    color: var(--fg-primary);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:hover { transform: translateY(-1px); }
  button:active { transform: none; }
  button, .chip, .seg button, .theme-btn, .scene-btn, .tab, .new-chat { transition: transform var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); }

  /* 原型脚手架，产品界面之外 */
  .proto {
    flex: 0 0 auto;
    min-height: 32px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 10px;
    padding: 5px 14px;
    background: color-mix(in srgb, var(--ink-950) 88%, var(--gold-400));
    border-bottom: 1px solid var(--border-hairline);
    color: var(--fg-tertiary);
    z-index: 30;
  }
  html:not(.dark) .proto { background: color-mix(in srgb, var(--paper-warm) 88%, var(--gold-400)); }
  .proto .mark {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-400);
    margin-right: 6px;
  }
  .scenes { display: flex; gap: 2px; flex: 1; flex-wrap: wrap; }
  .scene-btn, .theme-btn {
    height: 22px;
    padding: 0 9px;
    border: 0;
    background: transparent;
    color: var(--fg-tertiary);
    border-radius: var(--radius-sm);
    font-size: 12px;
  }
  .scene-btn:hover, .theme-btn:hover { color: var(--fg-primary); background: var(--paper-tint); }
  .scene-btn.active, .theme-btn.active {
    color: var(--gold-400);
    background: var(--gold-tint);
  }
  .themes { display: flex; gap: 2px; margin-left: auto; }

  .topbar {
    flex: 0 0 48px;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 16px;
    background: var(--topbar-bg);
    backdrop-filter: blur(var(--glass-blur-strong)) saturate(var(--glass-saturate));
    -webkit-backdrop-filter: blur(var(--glass-blur-strong)) saturate(var(--glass-saturate));
    border-bottom: 1px solid var(--border-hairline);
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 108px; }
  .seal {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    background: var(--gold-tint-strong);
    border: 1px solid var(--border-brand);
    border-radius: var(--radius-sm);
    color: var(--gold-400);
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
  }
  .brand-name {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .tabs { display: flex; gap: 4px; }
  .tab {
    height: 48px;
    padding: 0 12px;
    border: 0;
    background: transparent;
    color: var(--fg-secondary);
    font-size: 13px;
    position: relative;
  }
  .tab:hover { color: var(--fg-primary); background: var(--paper-tint-weak); }
  .tab.active { color: var(--gold-400); }
  .tab.active::after {
    content: "";
    position: absolute;
    left: 12px; right: 12px; bottom: 0;
    height: 2px;
    background: var(--gold-400);
    box-shadow: var(--gold-glow-md, 0 0 8px rgba(245,158,11,.6));
  }
  .top-right { margin-left: auto; width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--radius-md); color: var(--fg-tertiary); }

  .app { flex: 1; display: flex; min-height: 0; }

  .sidebar {
    width: 248px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border-hairline);
    background: color-mix(in srgb, var(--el-bg-color) 65%, transparent);
    min-height: 0;
  }
  .side-label {
    padding: 16px 16px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .session-list { flex: 1; overflow: auto; padding: 0 8px 16px; }
  .session {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 3px;
    text-align: left;
    border: 0;
    background: transparent;
    border-radius: var(--radius-md);
    padding: 9px 10px 9px 12px;
    position: relative;
    color: var(--fg-primary);
  }
  .session:hover { background: var(--paper-tint); }
  .session.active {
    background: var(--gold-tint);
  }
  .session.active::before {
    content: "";
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 2px;
    background: var(--gold-400);
    border-radius: 1px;
  }
  .session .title {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session .meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-tertiary);
  }
  .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--fg-muted); flex-shrink: 0; }
  .dot.run { background: var(--gold-400); }
  .dot.wait { background: var(--gold-300); }
  .dot.stuck { background: var(--cinnabar-400); }
  .dot.done { background: var(--bronze-500); }
  .dot.fail { background: var(--cinnabar-400); }
  .session .state { margin-left: auto; color: var(--fg-muted); }

  .maincol { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pagehead {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 28px 12px;
    flex-shrink: 0;
  }
  .pagehead .eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold-400);
    margin-bottom: 4px;
  }
  .pagehead h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: 0.05em;
  }
  .btn {
    height: 32px;
    padding: 0 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-default);
    background: var(--paper-tint);
    color: var(--fg-primary);
    font-size: 12px;
    font-weight: 500;
  }
  .btn:hover { border-color: var(--border-strong); }
  .btn.primary {
    background: var(--gold-400);
    border-color: var(--gold-400);
    color: #1A1308;
    box-shadow: 0 0 0 1px rgba(245,158,11,.2), 0 4px 12px rgba(245,158,11,.18);
  }
  .btn.primary:hover { background: var(--gold-300); }
  .btn.ghost { background: transparent; }
  .pagehead .btn.ghost { color: var(--fg-secondary); }

  .stage { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  .stage.empty { justify-content: center; }
  .thread {
    flex: 1;
    overflow: auto;
    padding: 8px 28px 12px;
    display: flex;
    flex-direction: column;
  }
  .thread .col { margin-top: auto; width: min(720px, 100%); }
  .stage.has-rail .thread .col { margin-top: 0; }
  .stage.empty .thread { display: none; }
  .col {
    width: min(720px, 100%);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .hero {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 28px 28px;
  }
  .stage.empty .hero { display: flex; }
  .hero .seal { width: 36px; height: 36px; font-size: 16px; margin-bottom: 16px; }
  .hero h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.35;
  }
  .hero p {
    margin: 8px 0 0;
    font-size: 13px;
    color: var(--fg-tertiary);
    line-height: 1.55;
  }

  .msg.user { display: flex; justify-content: flex-end; }
  .msg.assistant { display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
  .who {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--fg-muted);
  }
  .bubble {
    max-width: 68%;
    padding: 10px 16px;
    background: var(--user-bubble);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    font-size: 15px;
    line-height: 1.65;
  }
  .prose {
    font-size: 15.5px;
    line-height: 1.7;
    color: var(--fg-primary);
  }
  .prose p { margin: 0; }
  .prose p + p { margin-top: 10px; }

  .tool {
    border: 1px solid var(--border-hairline);
    background: var(--paper-tint-weak);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .tool summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 12px;
    color: var(--fg-secondary);
  }
  .tool summary::-webkit-details-marker { display: none; }
  .tool summary:hover { color: var(--fg-primary); }
  .tool .k {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .tool .name { font-family: var(--font-mono); font-size: 12px; color: var(--fg-primary); }
  .tool .res { margin-left: auto; font-size: 12px; color: var(--fg-tertiary); }
  .tool pre {
    margin: 0;
    padding: 0 12px 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.55;
    color: var(--fg-secondary);
    white-space: pre-wrap;
  }

  .progress {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--gold-400);
  }
  .pulse {
    width: 6px; height: 6px; border-radius: 99px;
    background: var(--gold-400);
    box-shadow: 0 0 0 0 rgba(245,158,11,.5);
    animation: pulse 1.6s var(--ease-out) infinite;
  }
  @keyframes pulse {
    50% { box-shadow: 0 0 0 5px rgba(245,158,11,0); }
  }

  .card {
    padding: 16px 18px 16px;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-xl);
    background: var(--el-bg-color-overlay);
  }
  .card.warn { border-color: color-mix(in srgb, var(--cinnabar-400) 45%, var(--border-default)); }
  .card .k {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-tertiary);
    margin-bottom: 6px;
  }
  .card.warn .k { color: var(--cinnabar-400); }
  .card h3 {
    margin: 0 0 12px;
    font-family: var(--font-serif-cn);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.03em;
    line-height: 1.35;
  }
  .code {
    margin: 0 0 14px;
    padding: 12px 14px;
    background: var(--paper-tint-weak);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-md);
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--fg-secondary);
    overflow: auto;
  }
  .card .actions { display: flex; gap: 8px; }

  .err { color: var(--cinnabar-400); }

  .dock {
    flex-shrink: 0;
    padding: 0 28px 20px;
  }
  .stage.empty .dock { padding-top: 0; }
  .dock-inner { width: min(720px, 100%); margin: 0 auto; }
  .hint {
    margin: 8px 0 0;
    font-size: 12px;
    color: var(--fg-muted);
    text-align: center;
  }
  .composer {
    background: var(--glass-strong-bg);
    backdrop-filter: blur(var(--glass-blur-strong)) saturate(var(--glass-saturate-strong));
    -webkit-backdrop-filter: blur(var(--glass-blur-strong)) saturate(var(--glass-saturate-strong));
    border: var(--glass-border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-md);
    padding: 10px 10px 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 6px 8px; }
  .chip {
    height: 22px;
    padding: 0 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-subtle);
    background: transparent;
    color: var(--fg-tertiary);
    font-size: 11px;
  }
  .chip.on {
    color: var(--gold-400);
    border-color: var(--border-brand);
    background: var(--gold-tint);
  }
  .composer textarea {
    width: 100%;
    min-height: 52px;
    max-height: 200px;
    resize: none;
    border: 0;
    background: transparent;
    padding: 4px 8px 8px;
    font-size: 15px;
    line-height: 1.6;
    outline: none;
  }
  .composer textarea::placeholder { color: var(--fg-muted); }
  .composer-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 4px 2px 6px;
  }
  .seg {
    display: inline-flex;
    background: var(--paper-tint);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-md);
    padding: 2px;
  }
  .seg button {
    height: 24px;
    padding: 0 8px;
    border: 0;
    background: transparent;
    color: var(--fg-tertiary);
    font-size: 12px;
    border-radius: var(--radius-sm);
  }
  .seg button.on {
    background: var(--el-bg-color-overlay);
    color: var(--fg-primary);
    box-shadow: var(--shadow-sm);
  }
  .quiet-select {
    height: 24px;
    border: 0;
    background: transparent;
    color: var(--fg-secondary);
    font-size: 12px;
    padding: 0 4px;
    max-width: 148px;
  }
  .send {
    width: 32px; height: 32px;
    margin-left: auto;
    border: 0;
    border-radius: var(--radius-md);
    background: var(--gold-400);
    color: #1A1308;
    display: grid; place-items: center;
    box-shadow: 0 4px 12px rgba(245,158,11,.22);
  }
  .send:hover { background: var(--gold-300); }
  .send:disabled { opacity: .4; cursor: default; transform: none; box-shadow: none; }
  .send.stop {
    background: color-mix(in srgb, var(--cinnabar-400) 18%, var(--el-bg-color-overlay));
    color: var(--cinnabar-400);
    box-shadow: none;
    border: 1px solid color-mix(in srgb, var(--cinnabar-400) 50%, transparent);
  }
  .send svg { width: 14px; height: 14px; display: block; }

  .artifact {
    display: none;
    width: 380px;
    flex-shrink: 0;
    flex-direction: column;
    min-height: 0;
    border-left: 1px solid var(--border-hairline);
    background: color-mix(in srgb, var(--el-bg-color) 80%, transparent);
  }
  .artifact.show { display: flex; }
  .art-head {
    padding: 18px 22px 10px;
  }
  .art-body { overflow: auto; padding: 0 22px 8px; }
  .art-body h2 {
    margin: 0 0 16px;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.03em;
    line-height: 1.3;
  }

function panelStatus(id) {
  const s = current;
  if (id === "plan") return s === "plan" ? { t: "待确认", k: "hot" } : { t: "无计划", k: "" };
  if (id === "records") {
    if (s === "run") return { t: "进行中 · 3/20", k: "hot" };
    if (s === "approve") return { t: "待审批", k: "hot" };
    if (s === "stuck") return { t: "卡住", k: "warn" };
    if (s === "done") return { t: "已完成", k: "" };
    if (s === "fail") return { t: "失败", k: "warn" };
    if (s === "workflow") return { t: "工作流进行中", k: "hot" };
    return { t: "暂无", k: "" };
  }
  if (id === "workflow") return s === "workflow" ? { t: "执行中", k: "hot" } : { t: "未启动", k: "" };
  if (id === "memory") return { t: "3 条", k: "" };
  if (id === "design") return s === "design" ? { t: "有预览", k: "hot" } : { t: "无预览", k: "" };
  if (id === "suggest") return { t: "3 条", k: "" };
  if (id === "project") return s === "empty" ? { t: "未绑定", k: "" } : { t: "OpenForgeSelf", k: "" };
  if (id === "todo") return { t: "3 条待处理", k: "" };
  if (id === "skills") return { t: "2 个已启用", k: "" };
  if (id === "tools") return { t: "已连接", k: "" };
  if (id === "snippets") return (s === "done" || s === "design") ? { t: "1 个", k: "" } : { t: "暂无", k: "" };
  return { t: "", k: "" };
}

function panelData(id) {
  if (id === "records") {
    if (current === "stuck") return ARTIFACTS.stuck;
    if (current === "done") return ARTIFACTS.done;
    if (current === "fail") return ARTIFACTS.recordsFail;
    if (current === "run" || current === "approve" || current === "workflow") return ARTIFACTS.recordsRun;
    return ARTIFACTS.recordsEmpty;
  }
  if (id === "snippets") {
    return (current === "done" || current === "design") ? ARTIFACTS.snippets : ARTIFACTS.snippetsEmpty;
  }
  return ARTIFACTS[id];
}

}

    <div class="art-body"><h2>${data.title}</h2>${data.body}</div>
    ${data.foot ? `<div class="art-foot">${data.foot}</div>` : ""}`;
}

function renderPins() {
  const row = document.getElementById("pins");
  if (!pins.length) { row.classList.remove("show"); row.innerHTML = ""; return; }
  row.classList.add("show");
  row.innerHTML = pins.map(n => `<span class="pin"><b>${n}</b><button class="x" type="button" data-unpin="${n}" aria-label="移除">×</button></span>`).join("");
}

function renderComposer(d) {
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.mode === d.mode));
  const send = document.getElementById("sendBtn");
  send.classList.toggle("stop", !!d.running);
  send.innerHTML = d.running ? iconStop : iconSend;
  send.setAttribute("aria-label", d.running ? "停止" : "发送");
  document.getElementById("hint").textContent = d.running
    ? "任务进行中。可以停止，或等它完成后再继续追问。"
    : "复用宿主已配置的模型，不另开账号。";
  const newBtn = document.getElementById("newBtn");
  newBtn.className = d.decision ? "btn ghost" : "btn primary";
  renderPins();
}

function render() {
  const d = SESSIONS[current];
  pins = (d.pins || []).slice();
  document.getElementById("eyebrow").textContent = `智能体 · ${d.modeLabel}`;
  document.getElementById("pageTitle").textContent = d.title;
  document.getElementById("stage").classList.toggle("empty", current === "empty");
  document.getElementById("stage").classList.toggle("has-rail", true);
  renderSessions();
  renderThread();
  renderArtifact();
  renderComposer(d);
  document.querySelectorAll(".scene-btn").forEach(b => {
    const m = SCENE_MAP[b.dataset.id];
    const on = m && m.session === current && m.panel === panel;
    b.classList.toggle("active", !!on);
  });
  document.getElementById("attachMenu").classList.remove("open");
  const def = DEFAULT_PANEL[current] || "catalog";
  const hash = (panel && panel !== def) ? current + ":" + panel : current;
  history.replaceState(null, "", "#" + hash);
}

function setScene(id) {
  const m = SCENE_MAP[id];
  if (m) {
    scene = id;
    current = m.session;
    panel = m.panel;
    render();
    return;
  }
  if (!SESSIONS[id]) return;
  scene = id;
  current = id;
  panel = DEFAULT_PANEL[id] || "catalog";
  render();
}

function openPanel(id) {
  panel = id || "catalog";
  const match = Object.keys(SCENE_MAP).find(k => SCENE_MAP[k].session === current && SCENE_MAP[k].panel === panel);
  scene = match || current;
  render();
}

document.getElementById("scenes").innerHTML = SCENES.map(s =>
  `<button class="scene-btn" type="button" data-id="${s.id}">${s.label}</button>`).join("");

document.getElementById("scenes").addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (b) setScene(b.dataset.id);
});
document.getElementById("sessions").addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (b) setScene(b.dataset.id);
});
document.querySelector(".themes").addEventListener("click", e => {
  const b = e.target.closest("[data-theme]");
  if (!b) return;
  const light = b.dataset.theme === "light";
  document.documentElement.classList.toggle("dark", !light);
  document.documentElement.dataset.theme = light ? "light" : "dark";
  document.querySelectorAll(".theme-btn").forEach(x => x.classList.toggle("active", x === b));
});
document.getElementById("modeSeg").addEventListener("click", e => {
  const b = e.target.closest("[data-mode]");
  if (!b) return;
  document.querySelectorAll("#modeSeg button").forEach(x => x.classList.toggle("on", x === b));
});
document.getElementById("newBtn").addEventListener("click", () => setScene("empty"));
document.getElementById("attachBtn").addEventListener("click", e => {
  e.stopPropagation();
  document.getElementById("attachMenu").classList.toggle("open");
});
document.getElementById("attachMenu").addEventListener("click", e => {
  const b = e.target.closest("[data-pin]");
  if (!b) return;
  const name = b.dataset.pin;
  if (!pins.includes(name)) pins.push(name);
  renderPins();
  document.getElementById("attachMenu").classList.remove("open");
});
document.getElementById("pins").addEventListener("click", e => {
  const b = e.target.closest("[data-unpin]");
  if (!b) return;
  pins = pins.filter(n => n !== b.dataset.unpin);
  renderPins();
});
document.addEventListener("click", e => {
  if (!e.target.closest(".attach")) document.getElementById("attachMenu").classList.remove("open");
});
document.getElementById("composer").addEventListener("submit", e => {
  e.preventDefault();
  const d = SESSIONS[current];
  if (d.running) { toast("已请求停止（原型演示）。"); return; }
  const v = document.getElementById("input").value.trim();
  if (!v) return;
  toast("原型未接入真实模型，发送仅作交互演示。");
});
document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("composer").requestSubmit();
  }
});
document.getElementById("artifact").addEventListener("click", e => {
  const back = e.target.closest("[data-act='back-catalog']");
  if (back) { e.stopPropagation(); openPanel("catalog"); return; }
  const item = e.target.closest("[data-open-panel]");
  if (item) { e.stopPropagation(); openPanel(item.dataset.openPanel); }
});
document.body.addEventListener("click", e => {
  if (e.target.closest("[data-act='back-catalog']") || e.target.closest("[data-open-panel]")) return;
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const map = {
    approve: "已批准，将继续执行（原型演示）。",
    cancel: "已取消（原型演示）。",
    confirm: "计划已确认，开始按步骤执行（原型演示）。",
    revise: "可以在右侧直接改，或在下方说明要怎么改。",
    help: "在下方补充信息后继续（原型演示）。",
    skip: "已跳过（原型演示）。",
    retry: "将重新请求（原型演示）。",
    pause: "工作流已暂停（原型演示）。",
    "write-memory": "将把这条结论写入记忆（原型演示）。",
    "publish-design": "确认后才会写入设计系统（原型演示）。",
    "do-workflow": "将按「周报产出流」继续（原型演示）。",
    "do-todo": "将下发这条待办（原型演示）。",
    "open-project": "将打开项目目录（原型演示）。",
    "run-cmd": "将启动前端（原型演示）。",
    dispatch: "已下发「补构建失败的复盘」（原型演示）。",
    "copy-snip": "已复制（原型演示）。"
  };
  toast(map[b.dataset.act] || "已记录（原型演示）。");
});

function tick() {
  const n = new Date();
  document.getElementById("clock").textContent = n.toTimeString().slice(0,8);
}
tick(); setInterval(tick, 1000);

(function boot() {
  const raw = (location.hash || "#empty").replace("#", "");
  const [sid, pid] = raw.split(":");
  if (SCENE_MAP[sid] || SESSIONS[sid]) {
    setScene(sid);
    if (pid) openPanel(pid);
    return;
  }
  if (PANEL_DEFS.some(p => p.id === sid)) {
    setScene("run");
    openPanel(sid);
    return;
  }
  setScene("empty");
})();
</script>
</body>
</html>
